id: workspace-metadata-app
name: Workspace Metadata App
version: 1.0.0
services:
  auth:
    enabled: true
    fabric:
      enabled: true
    password:
      enabled: true
    allowedRedirectUris:
      - http://localhost:5173
      - http://localhost:5174
      - http://127.0.0.1:5174
      - https://brave-coral-0a6d6fe867-centralus.webapp.fabricapps.net
      - https://curly-glen-99707183ed-centralus.webapp.fabricapps.net
  data:
    enabled: true
    dialect: mssql
  staticHosting:
    enabled: true
    folder: dist
    buildCommand: npm run build:fabric
    indexDocument: index.html
    assetAccess: protected
  storage:
    enabled: false
  functions:
    enabled: false
